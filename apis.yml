description: >-
  Capri Holdings Limited (NYSE: CPRI) is a global luxury fashion group whose portfolio is the Michael
  Kors and Jimmy Choo brands (Versace was sold to Prada in 2025 and no longer appears on the company's
  overview). It designs, markets and sells apparel, footwear, handbags and accessories through its own
  stores, wholesale partners, licensees and brand e-commerce sites. Capri Holdings publishes no developer
  program: the corporate site at capriholdings.com is a Q4-hosted investor-relations property (news, SEC
  filings, governance, ESG resources, careers) with no API, documentation, SDK, package, OpenAPI, GraphQL,
  MCP or A2A surface, and the api.capriholdings.com and developer.capriholdings.com hosts an earlier scaffold
  named do not resolve in DNS. Every /.well-known/* path answers with the IR platform's 'Invalid key'
  catch-all rather than a document. This profile records that absence honestly; nothing has been authored
  on the company's behalf.
