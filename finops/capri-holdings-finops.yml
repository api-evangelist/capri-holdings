    unit: varies
    aggregation: sum
principles:
  - name: Visibility
    description: Visibility into billing depends on partner contract reporting; no public usage telemetry
      is exposed.
  - name: Allocation
    description: Allocate by partnership and by brand (Versace, Jimmy Choo, Michael Kors) where contracts
      are brand-scoped.
  - name: Optimization
    description: Renegotiate volume tiers at renewal; align integration scope to brand omnichannel priorities.
  - name: Accountability
    description: Partnership owner holds budget; quarterly business reviews with Capri Holdings counterparts
      are typical.
